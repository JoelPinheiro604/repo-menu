<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background: dark terminal-punk base -->
  <rect width="256" height="256" fill="#0d0f0c"/>

  <!-- Worn industrial texture: scattered grime marks -->
  <g fill="#c9d1c4" opacity="0.06">
    <rect x="12" y="18" width="18" height="3"/>
    <rect x="190" y="40" width="22" height="2"/>
    <rect x="30" y="220" width="26" height="2"/>
    <rect x="200" y="198" width="16" height="3"/>
    <rect x="60" y="12" width="12" height="2"/>
    <rect x="150" y="238" width="30" height="2"/>
    <rect x="8" y="120" width="14" height="2"/>
    <rect x="228" y="140" width="16" height="2"/>
  </g>

  <!-- Glowing crate lid being pried open: back plate -->
  <g>
    <!-- Crate body, slightly off-kilter/rotated for grimy feel -->
    <polygon points="68,168 196,152 204,222 76,238" fill="#1a1f17" stroke="#c9d1c4" stroke-width="2" stroke-linejoin="miter"/>
    <!-- Crate inner dark void -->
    <polygon points="84,180 184,166 190,214 90,226" fill="#0d0f0c" stroke="#7dff9b" stroke-width="1.5" stroke-linejoin="miter" opacity="0.9"/>
    <!-- Crate slat lines (industrial) -->
    <line x1="88" y1="192" x2="186" y2="179" stroke="#c9d1c4" stroke-width="1" opacity="0.25"/>
    <line x1="89" y1="204" x2="188" y2="190" stroke="#c9d1c4" stroke-width="1" opacity="0.25"/>
    <line x1="90" y1="216" x2="189" y2="202" stroke="#c9d1c4" stroke-width="1" opacity="0.25"/>
  </g>

  <!-- Lid being forced up: glowing edge, angled -->
  <g>
    <!-- Lid slab -->
    <polygon points="60,148 192,128 200,152 68,172" fill="#2a3328" stroke="#7dff9b" stroke-width="2.5" stroke-linejoin="miter"/>
    <!-- Glow seeping from the crack between lid and crate -->
    <polygon points="70,166 192,146 196,154 74,174" fill="#7dff9b" opacity="0.85"/>
    <!-- Lid top highlight -->
    <line x1="66" y1="152" x2="190" y2="133" stroke="#c9d1c4" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Rusted metal crowbar: chunky stencil geometry, prying upward -->
  <g>
    <!-- Crowbar main shaft, angled up-right to down-left, worn -->
    <polygon points="118,138 132,132 96,196 82,202" fill="#c9d1c4" stroke="#0d0f0c" stroke-width="1.5" stroke-linejoin="miter"/>
    <!-- Crowbar hook/claw end gripping lid -->
    <polygon points="132,132 150,118 158,126 144,140 136,136" fill="#c9d1c4" stroke="#0d0f0c" stroke-width="1.5" stroke-linejoin="miter"/>
    <!-- Prying tip wedged into crack -->
    <polygon points="150,118 164,108 170,116 156,126" fill="#c9d1c4" stroke="#0d0f0c" stroke-width="1.5" stroke-linejoin="miter"/>
    <!-- Crowbar wear/rust patches -->
    <polygon points="100,188 112,180 108,194 96,200" fill="#ffb347" opacity="0.6"/>
    <polygon points="128,140 134,136 130,148 124,146" fill="#ffb347" opacity="0.5"/>
    <polygon points="142,128 150,122 148,134 140,132" fill="#ffb347" opacity="0.45"/>
    <!-- Crowbar foot/hook curled end -->
    <polygon points="82,202 76,214 84,218 88,208" fill="#c9d1c4" stroke="#0d0f0c" stroke-width="1.5" stroke-linejoin="miter"/>
    <!-- Rust on hook -->
    <polygon points="78,210 82,206 80,216 76,214" fill="#ffb347" opacity="0.55"/>
  </g>

  <!-- Ghostly skull emerging from crate: faint, covert, mischievous -->
  <g opacity="0.38">
    <!-- Skull cranium -->
    <path d="M124 178 Q118 170 122 162 Q128 154 138 154 Q148 154 152 162 Q156 170 150 178 Z" fill="#7dff9b"/>
    <!-- Eye sockets -->
    <ellipse cx="130" cy="168" rx="5" ry="4" fill="#0d0f0c"/>
    <ellipse cx="144" cy="168" rx="5" ry="4" fill="#0d0f0c"/>
    <!-- Glint pupils -->
    <circle cx="131" cy="167" r="1.5" fill="#7dff9b" opacity="0.9"/>
    <circle cx="145" cy="167" r="1.5" fill="#7dff9b" opacity="0.9"/>
    <!-- Nose hole -->
    <polygon points="137,174 134,179 140,179" fill="#0d0f0c"/>
    <!-- Jaw/teeth suggestion -->
    <rect x="130" y="180" width="2" height="4" fill="#0d0f0c" opacity="0.8"/>
    <rect x="134" y="180" width="2" height="4" fill="#0d0f0c" opacity="0.8"/>
    <rect x="138" y="180" width="2" height="4" fill="#0d0f0c" opacity="0.8"/>
    <rect x="142" y="180" width="2" height="4" fill="#0d0f0c" opacity="0.8"/>
  </g>

  <!-- Glitch artifacts: vertical slice offsets, subtle -->
  <g opacity="0.7">
    <rect x="86" y="158" width="48" height="2" fill="#7dff9b" opacity="0.35"/>
    <rect x="120" y="196" width="56" height="1.5" fill="#ffb347" opacity="0.4"/>
    <rect x="72" y="184" width="30" height="1.5" fill="#c9d1c4" opacity="0.3"/>
    <rect x="154" y="142" width="34" height="1.5" fill="#7dff9b" opacity="0.3"/>
  </g>

  <!-- Small wordmark: stencil-ish terminal, bottom-left -->
  <text x="16" y="248" font-family="monospace" font-size="11" font-weight="bold" fill="#c9d1c4" letter-spacing="3" opacity="0.65">REPO MENU</text>

  <!-- Terminal cursor blink block -->
  <rect x="116" y="240" width="7" height="10" fill="#7dff9b" opacity="0.6"/>
</svg>
